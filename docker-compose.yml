# ══════════════════════════════════════════════════════════════════════
# Docker Compose — Credit Risk Prediction System
# ══════════════════════════════════════════════════════════════════════
# 
# QUICK START:
#   docker-compose up -d           # Start API + Frontend
#   docker-compose up -d api       # Start API only
#   docker-compose down            # Stop all
#   docker-compose logs -f api     # View logs
#
# REBUILD (uses cached pip packages):
#   docker-compose build           # Normal build (uses cache)
#   docker-compose build --no-cache api   # Full rebuild
#
# Author: 7afnawi for Hefny
# ══════════════════════════════════════════════════════════════════════

services:
  # ════════════════════════════════════════════════════════════════════
  # API Service — FastAPI Backend
  # ════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: credit-risk-api:latest
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      # Models directory (read-only for security)
      - ./models:/app/models:ro
      # Pip cache for faster rebuilds
      - pip-cache:/root/.cache/pip
    environment:
      - API_ENV=production
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - credit-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ════════════════════════════════════════════════════════════════════
  # Frontend Service — Streamlit Dashboard
  # ════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: credit-risk-frontend:latest
    container_name: credit-risk-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - credit-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ════════════════════════════════════════════════════════════════════
  # Nginx Reverse Proxy (Production)
  # ════════════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: credit-risk-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - credit-network
    profiles:
      - production

# ════════════════════════════════════════════════════════════════════
# Networks
# ════════════════════════════════════════════════════════════════════
networks:
  credit-network:
    driver: bridge
    name: credit-risk-network

# ════════════════════════════════════════════════════════════════════
# Volumes — Persist pip cache for faster rebuilds
# ════════════════════════════════════════════════════════════════════
volumes:
  pip-cache:
    name: credit-risk-pip-cache
